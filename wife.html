<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致我最爱的妻子</title>
    <!-- 引入 Vue 3 的 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 canvas-confetti 烟花特效库 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        /* 全局重置与字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #0b0b1a;
            overflow: hidden; /* 防止出现滚动条 */
            color: #fff;
        }

        /* 星空背景画布 */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 主内容区域 */
        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* 标题 */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        /* 打字机效果区域 */
        .typewriter-box {
            font-size: 1.3rem;
            line-height: 1.8;
            min-height: 150px;
            max-width: 600px;
            color: #e0e0e0;
            margin-bottom: 40px;
            white-space: pre-wrap;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        /* 光标样式 */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.3rem;
            background-color: #ff9a9e;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 按钮 */
        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            color: #fff;
            background: linear-gradient(45deg, #ff6b6b, #ff9a9e);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }

        /* 音乐控制按钮（右上角） */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 154, 158, 0.5);
            color: #ff9a9e;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .music-control.show {
            opacity: 1;
            pointer-events: auto;
        }
        .music-control:hover {
            background: rgba(255, 154, 158, 0.3);
            transform: scale(1.1);
        }

        /* 弹窗 (模态框) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #1a1a2e;
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 154, 158, 0.3);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-content h2 {
            color: #ff9a9e;
            margin-bottom: 15px;
        }
        .modal-content p {
            line-height: 1.6;
            margin-bottom: 25px;
            color: #ccc;
            white-space: pre-wrap;
        }
        .heart-icon {
            font-size: 3rem;
            color: #ff6b6b;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 星空背景 -->
    <canvas id="starCanvas"></canvas>

    <!-- 背景音乐 (请将 music.mp3 替换为你喜欢的音乐文件) -->
    <audio id="bgMusic" src="zhixinairen.mp3" loop preload="auto"></audio>

    <!-- 右上角音乐控制按钮 -->
    <div class="music-control" :class="{ 'show': isMusicPlaying }" @click="toggleMusic">
        {{ isMusicPlaying ? '🎵' : '🔇' }}
    </div>

    <!-- Vue 挂载点 -->
    <div id="app" class="container">
        <!-- 标题 -->
        <h1>{{ title }}</h1>

        <!-- 打字机文字 -->
        <div class="typewriter-box">
            <div>
                <span>{{ typedText }}</span>
                <span class="cursor" v-show="isTyping"></span>
            </div>
        </div>

        <!-- 惊喜按钮：点击后同时触发音乐和烟花，并显示弹窗 -->
        <button class="btn" @click="openSurprise">
            💖 点击查收惊喜
        </button>

        <!-- 弹窗 (点击按钮后出现) -->
        <div class="modal-overlay" v-if="showSurprise" @click.self="showSurprise = false">
            <div class="modal-content">
                <div class="heart-icon">❤️</div>
                <h2>致我最爱的老婆</h2>
                <p>{{ surpriseMessage }}</p>
                <!-- “我也爱你”按钮：仅关闭弹窗 -->
                <button class="btn" @click="showSurprise = false">我也爱你</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, onUnmounted } = Vue;

        createApp({
            setup() {
                // 1. 标题响应式数据
                const title = ref('致我最爱的妻子');

                // 2. 打字机数据
                const fullText = "遇见你，是我这辈子最大的幸运。\n感谢你包容我的缺点，\n感谢你为这个家付出的一切。\n今天，我想用代码对你说：\n余生，请多指教。";
                const typedText = ref('');
                const isTyping = ref(true);

                // 3. 弹窗控制
                const showSurprise = ref(false);
                const surpriseMessage = ref('老婆，辛苦啦！\n这个网页是我专门为你写的，\n不求事事圆满，只求岁岁相伴，\n踏踏实实把每一天过好。\n愿咱们一家人，不求一世无风雨，\n但无论顺逆，心中常有盼头，\n身边彼此依靠，好好相守，稳步前行。\n永远相信明天会更好！');

                // 4. 音乐控制相关
                const isMusicPlaying = ref(false);
                // 用来存储烟花定时器
                let fireworksInterval = null;

                // 5. 打字机逻辑
                const startTyping = () => {
                    let i = 0;
                    const timer = setInterval(() => {
                        if (i < fullText.length) {
                            typedText.value += fullText.charAt(i);
                            i++;
                        } else {
                            clearInterval(timer);
                            isTyping.value = false;
                        }
                    }, 120);
                };

                // 6. 星空背景逻辑
                const initStars = () => {
                    const canvas = document.getElementById('starCanvas');
                    const ctx = canvas.getContext('2d');
                    let stars = [];

                    const resize = () => {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        stars = [];
                        for (let i = 0; i < 200; i++) {
                            stars.push({
                                x: Math.random() * canvas.width,
                                y: Math.random() * canvas.height,
                                radius: Math.random() * 1.5,
                                alpha: Math.random(),
                                speed: Math.random() * 0.02 + 0.005
                            });
                        }
                    };

                    const draw = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        stars.forEach(star => {
                            star.alpha += star.speed;
                            if (star.alpha > 1 || star.alpha < 0) {
                                star.speed = -star.speed;
                            }
                            ctx.beginPath();
                            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                            ctx.fill();
                        });
                        requestAnimationFrame(draw);
                    };

                    window.addEventListener('resize', resize);
                    resize();
                    draw();
                };

                // 7. 烟花播放逻辑（抽离成独立函数，供点击按钮时调用）
                const startFireworks = () => {
                    if (fireworksInterval) return; // 防止重复启动

                    const defaults = { 
                        startVelocity: 30, 
                        spread: 360, 
                        ticks: 80, 
                        zIndex: 100 
                    };

                    function randomInRange(min, max) {
                        return Math.random() * (max - min) + min;
                    }

                    fireworksInterval = setInterval(function() {
                        const particleCount = randomInRange(30, 80);

                        // 左侧烟花
                        confetti(Object.assign({}, defaults, { 
                            particleCount,
                            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                        }));
                        
                        // 右侧烟花
                        confetti(Object.assign({}, defaults, { 
                            particleCount,
                            origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                        }));

                        // 中间偶尔大烟花
                        if (Math.random() > 0.5) {
                            confetti(Object.assign({}, defaults, { 
                                particleCount: particleCount * 1.5,
                                spread: 120,
                                origin: { x: randomInRange(0.3, 0.7), y: 0.5 },
                                colors: ['#ff6b6b', '#ff9a9e', '#fecfef', '#ffffff']
                            }));
                        }

                    }, 400);
                };

                // 8. 核心：点击第一个按钮，同时开启音乐和烟花，并弹出窗口
                const openSurprise = () => {
                    // 第一步：显示弹窗
                    showSurprise.value = true;

                    // 第二步：播放音乐
                    const audio = document.getElementById('bgMusic');
                    if (audio) {
                        audio.play().then(() => {
                            isMusicPlaying.value = true;
                        }).catch(error => {
                            console.log("音乐播放失败（可能缺少 music.mp3 文件或浏览器拦截）:", error);
                            isMusicPlaying.value = false;
                        });
                    }

                    // 第三步：启动烟花
                    startFireworks();
                };

                // 9. 音乐开关（右上角）
                const toggleMusic = () => {
                    const audio = document.getElementById('bgMusic');
                    if (audio) {
                        if (isMusicPlaying.value) {
                            audio.pause();
                            isMusicPlaying.value = false;
                        } else {
                            audio.play();
                            isMusicPlaying.value = true;
                        }
                    }
                };

                // 10. 生命周期钩子
                onMounted(() => {
                    initStars();
                    startTyping();
                });

                onUnmounted(() => {
                    if (fireworksInterval) {
                        clearInterval(fireworksInterval);
                    }
                });

                return {
                    title,
                    typedText,
                    isTyping,
                    showSurprise,
                    surpriseMessage,
                    isMusicPlaying,
                    openSurprise,
                    toggleMusic
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
